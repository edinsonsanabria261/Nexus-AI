name: Asistente Gemini en GitHub

on:
  push:
    branches: [ "main", "master" ]

jobs:
  arreglar-interfaz:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio al entorno
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install google-genai

      - name: Analizar archivos web y corregir con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          from google import genai
          
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          
          # Buscamos archivos comunes de tu proyecto web
          archivos_a_buscar = ['app.py', 'main.py', 'index.html', 'script.js']
          contenido_total = ''
          
          for archivo in archivos_a_buscar:
              if os.path.exists(archivo):
                  with open(archivo, 'r', encoding='utf-8') as f:
                      contenido_total += f'\n\n--- ARCHIVO: {archivo} ---\n' + f.read()
          
          prompt = f'''
          Actúa como un desarrollador experto en frontend y Supabase. 
          En mi interfaz web alojada en Render tengo este error en el navegador: 
          'NotFoundError: Failed to execute 'removeChild' on 'Node': The node to be removed is not a child of this node.' 
          Esto pasa al hacer clic en 'Nueva conversación' o limpiar el DOM.
          
          Aquí está el código actual de mi proyecto:
          {contenido_total}
          
          Por favor, dime exactamente qué líneas debo modificar y dame el código corregido en JavaScript o Python para solucionar este error de DOM y hacer que el botón de nueva conversación funcione de manera fluida con Supabase.
          '''
          
          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt
          )
          
          print('=== SOLUCIÓN GENERADA POR GEMINI PARA TU WEB ===')
          print(response.text)
          "
